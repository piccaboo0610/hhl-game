<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>洪荒历 · 大领主</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --border:#30363d; --text:#e6edf3;
    --dim:#8b949e; --accent:#e3b341; --danger:#f85149; --green:#3fb950;
    --bar-bg:#21262d; --bar-fill:#e3b341; --dice:#58a6ff;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;height:100vh;overflow:hidden;}
  button{font-family:inherit;cursor:pointer;}

  /* 设置页 */
  #setup{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:100;padding:16px;}
  #setup .box{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:32px;width:420px;max-width:92vw;}
  #setup h1{font-size:22px;margin-bottom:6px;color:var(--accent);}
  #setup p{color:var(--dim);font-size:13px;margin-bottom:20px;line-height:1.6;}
  #setup label{display:block;font-size:13px;margin-bottom:6px;color:var(--dim);}
  #setup input{width:100%;padding:10px 12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px;margin-bottom:16px;}
  #setup .btn{width:100%;padding:12px;background:var(--accent);color:#0d1117;border:none;border-radius:8px;font-size:15px;font-weight:600;}
  #setup .hint{font-size:12px;color:var(--dim);margin-top:12px;line-height:1.6;}

  /* 游戏界面 */
  #game{display:flex;height:100vh;}
  #sidebar{width:340px;min-width:280px;background:var(--panel);border-right:1px solid var(--border);overflow-y:auto;padding:16px;flex-shrink:0;}
  #sidebar h2{font-size:15px;color:var(--accent);margin-bottom:12px;border-bottom:1px solid var(--border);padding-bottom:8px;}
  .stat-row{display:flex;justify-content:space-between;font-size:13px;padding:3px 0;line-height:1.5;gap:8px;}
  .stat-row .k{color:var(--dim);flex-shrink:0;}
  .stat-row .v{font-weight:600;text-align:right;word-break:break-all;}
  .bar{height:8px;background:var(--bar-bg);border-radius:4px;overflow:hidden;margin:3px 0 8px;}
  .bar>div{height:100%;background:var(--bar-fill);border-radius:4px;transition:width .3s;}
  .bar.corruption>div{background:var(--danger);}
  .bar.green>div{background:var(--green);}
  .sec{margin-bottom:14px;}
  .sec-title{font-size:12px;color:var(--dim);margin-bottom:4px;}

  #main{flex:1;display:flex;flex-direction:column;min-width:0;}
  #log{flex:1;overflow-y:auto;padding:20px 24px;line-height:1.8;font-size:15px;}
  #log .wrap{max-width:820px;margin:0 auto;}
  #log .time{color:var(--accent);font-weight:700;margin:14px 0 6px;}
  #log .narr{white-space:pre-wrap;}
  #log .narr .dice{color:var(--dice);font-weight:600;background:#1c2531;border-radius:4px;padding:1px 5px;margin:0 2px;}
  #log .panel{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:12px;margin:8px 0;font-size:13px;white-space:pre-wrap;color:var(--dim);}
  #log .sep{color:var(--border);text-align:center;margin:8px 0;}
  #log .userline{color:var(--dim);font-size:13px;margin:10px 0 4px;}

  #bottom{border-top:1px solid var(--border);padding:14px 20px;background:var(--panel);}
  #bottom .inner{max-width:820px;margin:0 auto;}
  #options{display:flex;flex-direction:column;gap:8px;margin-bottom:12px;}
  .opt{text-align:left;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px;}
  .opt:hover:not(:disabled){border-color:var(--accent);}
  .opt:disabled{opacity:.4;cursor:not-allowed;}
  #inputrow{display:flex;gap:8px;}
  #input{flex:1;padding:10px 12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px;}
  #input:disabled,#send:disabled{opacity:.5;cursor:not-allowed;}
  #send{padding:10px 18px;background:var(--accent);color:#0d1117;border:none;border-radius:8px;font-weight:600;}
  #loading{color:var(--dim);font-size:13px;margin-bottom:8px;display:none;}
  #gameover{display:none;background:#2d1a1a;border:1px solid var(--danger);color:#ffb3b3;border-radius:8px;padding:14px;margin-bottom:12px;font-size:14px;font-weight:600;}

  /* 响应式 */
  @media (max-width:760px){
    #game{flex-direction:column;}
    #sidebar{width:100%;min-width:0;max-height:32vh;border-right:none;border-bottom:1px solid var(--border);}
    #log{padding:14px;}
    #bottom{padding:10px;}
  }
</style>
</head>
<body>

<!-- 设置页 -->
<div id="setup">
  <div class="box">
    <h1>洪荒历 · 大领主</h1>
    <p>接入 OpenAI 兼容 API 的文字游戏（DeepSeek / 小米 MiMo / Kimi 等）。Key 仅存于本机浏览器，并随请求发送给对应 API 官方接口。</p>
    <label>API 地址（OpenAI 兼容 /chat/completions）</label>
    <input id="apibase" placeholder="https://api.deepseek.com/chat/completions">
    <label>模型名</label>
    <input id="model" placeholder="deepseek-chat">
    <label>API Key</label>
    <input id="apikey" type="password" placeholder="sk-... / 你的 Key">
    <button class="btn" id="saveKey">保存并进入游戏</button>
    <div class="hint">
      常用配置：<br>
      · DeepSeek：地址 api.deepseek.com/chat/completions，模型 deepseek-chat<br>
      · 小米 MiMo：地址 api.xiaomimimo.com/v1/chat/completions，模型 mimo-v2.5-pro（或 mimo-v2-flash）<br>
      存档自动保存在浏览器本地。
    </div>
  </div>
</div>

<!-- 游戏界面 -->
<div id="game" style="display:none;">
  <div id="sidebar">
    <h2>状态卡</h2>
    <div id="statcard"></div>
    <div class="sec" style="margin-top:10px;">
      <div class="sec-title">操作</div>
      <button class="opt" id="btnRestart" style="margin-bottom:6px;">重新开始</button>
      <button class="opt" id="btnExport" style="margin-bottom:6px;">导出存档</button>
      <button class="opt" id="btnImport" style="margin-bottom:6px;">导入存档</button>
      <button class="opt" id="btnChangeKey">更换 API Key</button>
    </div>
  </div>
  <div id="main">
    <div id="log"><div class="wrap"></div></div>
    <div id="bottom">
      <div class="inner">
        <div id="loading">主神正在结算……</div>
        <div id="gameover"></div>
        <div id="options"></div>
        <div id="inputrow">
          <input id="input" placeholder="输入你的行动……（或直接点上面选项）">
          <button id="send">发送</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script type="text/plain" id="system-prompt">
你是文字游戏《洪荒历 · 大领主》的引擎、主神空间、以及所有 NPC。玩家是一名被大领主吴明召唤到洪荒历的「脚男」。

## 世界观
- 洪荒历：人类最弱，被万族当食物/奴隶/材料。吴明开辟「禁地人类城」庇护人类，脚男被召唤成为其麾下的脚男军团一员。
- 玩家视角：脚男（现代人）。开局伪装成登录网游《洪荒OL》，之后才会发现退出键消失、自己真穿越了。
- 关键反转：只有玩家的退出键不见了（别的脚男都能下线回家），所以只有玩家会「变质」（失去人性）。

## 时间字段口径（务必遵守，不得混算）
- day：当前游戏内总天数（自被召唤起累计）。
- signin_day：累计已发放签到的天数（每满 1 天发 1 次签到，与 day 同步但签到只数整天）。
- day_frac：不足 1 天的小数天数计数器（半天等累计，满 1 天并入 day 并触发签到）。
- worldclock_day：世界时钟「下次推进」所在的天数（= 上次推进天数 + 10；每流逝 10 天推 1 格，多格聚合）。
- 关系：每回合先判断消耗天数 → 更新 day 与 day_frac → 按整天数发签到并累加 signin_day → 检查 worldclock（流逝天数÷10 取整推进）→ 检查心魔保底。

## 资源与货币
- 奖励点：主神空间货币（兑换功法/法宝/体质/属性/修复）。击杀、任务、副本、签到获得。
- 灵石：洪荒大陆货币（万族交易、传送阵、买材料、拍卖）。奖励点可换灵石（1奖励点≈100灵石），灵石不能换奖励点。
- 复活次数：基础5，硬上限10。归零再死=真死。
- 可能性：极稀有，可改命免死/许愿变强/召唤外援/清变质。
- 变质值：被困越久越失去人性。死亡固定 +8；corruption_min 记录不可被清除的累积下限（每死 +1）。满 100 = 人格崩坏（game_over=true，偏转态结局）。

## 成长体系（四大体系并行，可全修）
1. 修真境界：炼气九层→筑基→金丹→元婴→仙人。核心是「理解符文」，靠闭关参悟（跳时间涨进度）。炼气以周计、筑基以月计、金丹以年计、元婴以数年计。
2. 基因锁：一阶→五阶。一~三阶靠战斗濒死开锁（累计3次成功升一阶）；三阶圆满后进四阶需过「心魔劫」；四阶升五阶需「悟道」大机缘。
3. 体质：凡品→灵品→玄品→圣品→先天，靠觉醒/机缘/主神兑换。
4. 机甲/科技：初代→进阶→精英→王牌→神机，靠制造/升级。

## 基础属性（六大类，普通100点）
- 智力：符文解析力/计算力，决定闭关参悟速度。
- 精神力：神识、意志、抗精神攻击。
- 细胞活力：气血恢复、自愈、抗毒。
- 神经反应速度：反应、先手判定、闪避、机甲驾驶。
- 肌肉组织强度：近战攻击、力量、负重、承受G力。
- 免疫力强度：抗病、抗毒、抗诅咒、抗永夜侵蚀。

## 输出铁律（必须遵守）
1. 每回合只推进1个事件节点，输出后停止等玩家。时间可因闭关/赶路快进。
2. 关键判定必须亮骰〔d100=N〕。
3. 胜利就是胜利（二选一），受伤是独立轴（轻伤-10~20气血/中伤-30~50+虚弱/重伤-60~80）。
4. 阶级鸿沟难跨：越1大境界无倚仗基本输，越2大境界送死。
5. 会死能复活，复活归零真死，不得偷偷续命。
6. 签到自动发放：每累计1天=1次签到（奖励点=1000+Lv×500 + 随机1件物品按Lv档），严禁让玩家确认领取。
7. 设定不可篡改，不得用自己的常识推翻玩家设定。
8. 语气切换：主神播报/规则=冰冷；NPC说话用「吴明：」「子牙：」前缀；旁白=中性叙述。
9. Lv = 各体系中最高档位对应的Lv区间中值（炼气/一阶=1~9、筑基/二阶=10~19、金丹/三阶=20~34、元婴/四阶=35~49、仙人/五阶=50+）。
10. 闭关纯安全快进（不掷事件池，事件顺延出关后），闭关期间周期节点照发（并入结算面板清单化），但世界时钟照常推进（流逝天数÷10取整）。

## 游戏结束态
- 变质满 100 → game_over=true，结局=偏转态（人格崩坏）。
- 复活归零再死 → game_over=true，结局=真死。
- game_over=true 时，narrative 写结局结算，options 留空，state.game_over=true。

## 输出格式（务必严格遵守）
你必须只返回一个 JSON 对象，不要有任何 JSON 之外的文字或代码块标记。格式：

{"time":"洪荒历 · 被召唤后 · 第X天","narrative":"剧情文字（可用**粗体**、换行、===分隔线）","options":["选项1","选项2","选项3"],"state":{...}}

state 字段（完整状态，前端按此渲染）：
{"name":"","sex":"男","age":20,"lv":1,"realm":"无修真境界","progress":0,
"genelock":"无","genecount":"0/3",
"attributes":{"智力":100,"精神力":100,"细胞活力":100,"神经反应":100,"肌肉组织":100,"免疫力":100},
"hp":100,"hp_max":100,"mp":100,"mp_max":100,
"revive":5,"revive_max":5,
"corruption":0,"corruption_min":0,
"signin_day":0,"day_frac":0,"possibility":0,
"reward_points":0,"spirit_stone":0,
"bonds":{},"obsession":"",
"worldclock_day":10,"heartdemon_left":null,
"day":1,"main_story":"新手任务·人类城立足","camp":"大领主吴明","reputation":"友善",
"state_effects":[],"game_over":false,"ending":""}

规则：state 必须包含所有这些字段并保持前后连贯；options 给 2~4 个可选项（game_over 时留空）；narrative 必须有实质剧情描写（1~4句，绝不能为空）；ending 在 game_over=true 时填结局名（如「偏转态 · 人格崩坏」「真死」），否则留空字符串。
开局：玩家说「开始游戏」时，先输出创角面板（问游戏 ID、性别年龄、出身），再进入召唤剧情。
</script>

<script>
window.addEventListener("error", function(e){
  try {
    var d = document.createElement("div");
    d.style.cssText = "position:fixed;bottom:0;left:0;right:0;background:#f85149;color:#fff;padding:12px;z-index:99999;font-size:13px;font-family:monospace;white-space:pre-wrap;";
    d.textContent = "⚠ 脚本错误：" + (e.message || "未知") + "（第" + (e.lineno||"?") + "行）";
    document.body.appendChild(d);
  } catch(_){}
});
(function(){
  const MAX_HISTORY = 30;
  const SYSTEM_PROMPT = document.getElementById("system-prompt").textContent.trim();

  const DEFAULT_STATE = {
    name:"", sex:"男", age:20, lv:1, realm:"无修真境界", progress:0,
    genelock:"无", genecount:"0/3",
    attributes:{智力:100,精神力:100,细胞活力:100,神经反应:100,肌肉组织:100,免疫力:100},
    hp:100, hp_max:100, mp:100, mp_max:100,
    revive:5, revive_max:5,
    corruption:0, corruption_min:0,
    signin_day:0, day_frac:0, possibility:0,
    reward_points:0, spirit_stone:0,
    bonds:{}, obsession:"",
    worldclock_day:10, heartdemon_left:null,
    day:1, main_story:"新手任务·人类城立足", camp:"大领主吴明", reputation:"友善",
    state_effects:[], game_over:false, ending:""
  };

  const store = {
    get(k, d){ try{ return JSON.parse(localStorage.getItem(k)) ?? d; }catch(e){ return d; } },
    set(k, v){ localStorage.setItem(k, JSON.stringify(v)); }
  };

  let apiBase = store.get("hhl_apibase", "https://api.deepseek.com/chat/completions");
  let model = store.get("hhl_model", "deepseek-chat");
  let apiKey = store.get("hhl_apikey", "");
  let state = null;
  let history = [];
  let lastOptions = [];
  let busy = false;

  const $ = id => document.getElementById(id);
  const setupEl = $("setup"), gameEl = $("game");
  const logWrap = document.querySelector("#log .wrap");
  const statEl = $("statcard"), optsEl = $("options");
  const inputEl = $("input"), sendEl = $("send"), loadingEl = $("loading");
  const gameoverEl = $("gameover");

  // 预填设置页（若有已保存配置；元素缺失则跳过，防旧缓存报错导致后续按钮失效）
  if($("apibase")) $("apibase").value = apiBase;
  if($("model")) $("model").value = model;
  if($("apikey")) $("apikey").value = apiKey;

  try {
    if(apiKey){ enterGame(); }
  } catch(e) {
    // 存档损坏导致进入游戏失败：自动清空坏存档，回设置页
    try { store.set("hhl_state", {state:null, history:[], lastOptions:[]}); } catch(_){}
    setupEl.style.display = "flex";
    gameEl.style.display = "none";
    console.warn("[洪荒历] 载入失败已自动重置:", e.message);
  }
  $("saveKey").onclick = () => {
    const k = $("apikey").value.trim();
    if(!k){ alert("请填入 API Key"); return; }
    apiBase = $("apibase").value.trim() || "https://api.deepseek.com/chat/completions";
    model = $("model").value.trim() || "deepseek-chat";
    apiKey = k;
    store.set("hhl_apibase", apiBase);
    store.set("hhl_model", model);
    store.set("hhl_apikey", k);
    enterGame();
  };
  $("btnChangeKey").onclick = () => {
    // 直接切回设置页（不 reload，避免 file:// 下 reload 失效），预填当前配置
    $("apibase").value = apiBase;
    $("model").value = model;
    $("apikey").value = apiKey;
    setupEl.style.display = "flex";
    gameEl.style.display = "none";
    alert("已切换到设置页，可修改 API 地址 / 模型 / Key，改完点「保存并进入游戏」。");
  };

  function enterGame(){
    setupEl.style.display = "none";
    gameEl.style.display = "flex";
    const saved = store.get("hhl_state", null);
    if(saved && saved.state){ resumeGame(saved); }
    else {
      addLog("system", "欢迎来到《洪荒历 · 大领主》。输入「开始游戏」即可创角。");
      renderState();
    }
  }

  function resumeGame(saved){
    state = mergeState(saved.state);
    history = saved.history || [];
    lastOptions = saved.lastOptions || [];
    renderState(); renderHistory();
    if(lastOptions.length){ renderOptions(lastOptions); }
    renderGameover();
    addLog("system", "已载入本地存档，继续游戏。");
  }

  $("btnRestart").onclick = () => {
    if(confirm("确定重新开始？当前进度会被清除。")){
      state = null; history = []; lastOptions = [];
      store.set("hhl_state", {state:null, history:[], lastOptions:[]});
      logWrap.innerHTML = ""; optsEl.innerHTML = "";
      gameoverEl.style.display = "none";
      inputEl.disabled = false; sendEl.disabled = false;
      addLog("system", "已重新开始。输入「开始游戏」创角。");
      renderState();
    }
  };

  $("btnExport").onclick = () => {
    const data = { state, history: history.slice(-30), lastOptions, exportedAt: new Date().toISOString() };
    const blob = new Blob([JSON.stringify(data, null, 2)], {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "洪荒历存档_"+(state&&state.name?state.name:"空")+".json";
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
  };

  $("btnImport").onclick = () => {
    const inp = document.createElement("input");
    inp.type = "file"; inp.accept = "application/json";
    inp.onchange = e => {
      const f = e.target.files[0]; if(!f) return;
      const r = new FileReader();
      r.onload = () => {
        try{
          const d = JSON.parse(r.result);
          if(!("state" in d)){ alert("存档文件格式不对"); return; }
          state = mergeState(d.state);
          history = d.history || [];
          lastOptions = d.lastOptions || [];
          store.set("hhl_state", {state, history, lastOptions});
          logWrap.innerHTML = "";
          renderState(); renderHistory();
          if(lastOptions.length){ renderOptions(lastOptions); }
          renderGameover();
          addLog("system", "已导入存档，继续游戏。");
        }catch(err){ alert("导入失败："+err.message); }
      };
      r.readAsText(f);
    };
    inp.click();
  };

  function mergeState(incoming){
    try{
      const merged = JSON.parse(JSON.stringify(DEFAULT_STATE));
      if(!incoming) return merged;
      for(const k in DEFAULT_STATE){
        if(incoming[k] !== undefined && incoming[k] !== null) merged[k] = incoming[k];
      }
      for(const k in incoming){
        if(!(k in DEFAULT_STATE) && incoming[k] !== undefined && incoming[k] !== null){
          merged[k] = incoming[k];
        }
      }
      if(incoming.attributes && typeof incoming.attributes === "object" && !Array.isArray(incoming.attributes)){
        merged.attributes = Object.assign({}, DEFAULT_STATE.attributes, incoming.attributes);
      }
      if(Array.isArray(incoming.state_effects)) merged.state_effects = incoming.state_effects;
      if(incoming.bonds && typeof incoming.bonds === "object" && !Array.isArray(incoming.bonds)){
        merged.bonds = Object.assign({}, incoming.bonds);
      }
      return merged;
    }catch(e){
      console.warn("[洪荒历] 存档数据损坏，已重置为默认状态:", e.message);
      return JSON.parse(JSON.stringify(DEFAULT_STATE));
    }
  }

  async function callAI(messages, retry=1){
    const ctrl = new AbortController();
    const timer = setTimeout(()=>ctrl.abort(), 90000);
    try{
      const res = await fetch(apiBase, {
        method:"POST",
        headers:{ "Content-Type":"application/json", "Authorization":"Bearer "+apiKey },
        body: JSON.stringify({
          model: model,
          messages: messages,
          temperature: 0.8,
          max_tokens: 4000,
          response_format: { type:"json_object" }
        }),
        signal: ctrl.signal
      });
      if(!res.ok){
        const err = await res.text();
        throw new Error("HTTP "+res.status+"："+err.slice(0,200));
      }
      const data = await res.json();
      return data.choices[0].message.content;
    }catch(e){
      if(retry > 0 && (e.name==="AbortError" || e instanceof TypeError || e.message.startsWith("HTTP 5"))){
        await new Promise(r=>setTimeout(r, 800));
        return callAI(messages, retry-1);
      }
      throw e;
    }finally{
      clearTimeout(timer);
    }
  }

  function buildMessages(){
    const sys = SYSTEM_PROMPT + "\n\n【当前状态】\n" + JSON.stringify(state||DEFAULT_STATE);
    const msgs = [{role:"system", content: sys}];
    msgs.push(...history.slice(-MAX_HISTORY));
    return msgs;
  }

  function applyReply(raw){
    const reply = safeParse(raw);
    if(!reply){
      const undone = history.pop(); // 回滚刚才 push 的 user（无对应回复）
      if(undone && undone.role === "user"){ inputEl.value = undone.content; rollbackUserLog(); }
      if(lastOptions.length){ renderOptions(lastOptions); }
      addLog("system", "AI 返回格式异常，已回滚本回合。请重试或换种说法。原始片段："+String(raw).slice(0,300));
      return;
    }
    if(reply.state){ state = mergeState(reply.state); }
    else { console.warn("[洪荒历] 本回合 reply.state 缺失，沿用旧状态，数值可能与剧情脱节。"); }
    lastOptions = reply.options || [];
    history.push({ role:"assistant", content: JSON.stringify({time:reply.time, narrative:reply.narrative, options:lastOptions}) });
    addLog("time", reply.time);
    addLog("narr", reply.narrative);
    renderState();
    renderOptions(lastOptions);
    renderGameover();
    store.set("hhl_state", {state, history: history.slice(-30), lastOptions});
  }

  function safeParse(raw){
    if(!raw) return null;
    try{ return JSON.parse(raw); }catch(e){}
    const m = String(raw).match(/\{[\s\S]*\}/);
    if(m){ try{ return JSON.parse(m[0]); }catch(e){} }
    const s = String(raw);
    const idx = s.lastIndexOf('"}');
    if(idx > 0){ try{ return JSON.parse(s.slice(0, idx+2) + "}"); }catch(e){} }
    return null;
  }

  function sendAction(text){
    if(busy) return;
    const t = (text||"").trim();
    if(!t) return;
    setBusy(true);
    const user = { role:"user", content: t };
    history.push(user);
    optsEl.innerHTML = "";
    addLog("user", t);
    callAI(buildMessages()).then(applyReply).catch(e=>{
      history.pop();
      inputEl.value = t;
      rollbackUserLog();
      if(lastOptions.length){ renderOptions(lastOptions); }
      addLog("system", "调用失败："+e.message);
    }).finally(()=> setBusy(false));
  }

  $("send").onclick = () => { const t = inputEl.value; inputEl.value=""; sendAction(t); };
  inputEl.addEventListener("keydown", e => {
    if(e.key==="Enter" && !e.isComposing){
      const t = inputEl.value; inputEl.value=""; sendAction(t);
    }
  });
  optsEl.addEventListener("click", e => {
    const b = e.target.closest(".opt");
    if(b && !b.disabled){ sendAction(b.dataset.text); }
  });

  function setBusy(b){
    busy = b;
    const over = state && state.game_over;
    inputEl.disabled = b || over;
    sendEl.disabled = b || over;
    loadingEl.style.display = b ? "block" : "none";
    document.querySelectorAll("#options .opt").forEach(o=>o.disabled = b);
  }

  let lastUserLogEl = null;
  function addLog(kind, text){
    const d = document.createElement("div");
    if(kind==="time"){ d.className="time"; d.textContent = text; }
    else if(kind==="narr"){ d.className="narr"; d.innerHTML = fmtNarr(text); }
    else if(kind==="user"){ d.className="userline"; d.textContent = "▸ 你："+text; lastUserLogEl = d; }
    else if(kind==="system"){ d.className="panel"; d.textContent = "※ "+text; }
    logWrap.appendChild(d);
    logWrap.scrollTop = logWrap.scrollHeight;
    return d;
  }
  function rollbackUserLog(){
    if(lastUserLogEl && lastUserLogEl.parentNode){ lastUserLogEl.remove(); }
    lastUserLogEl = null;
  }

  function renderHistory(){
    logWrap.innerHTML = "";
    for(const m of history){
      if(m.role==="user") addLog("user", m.content);
      else if(m.role==="assistant"){
        const o = safeParse(m.content);
        if(o){ addLog("time", o.time); addLog("narr", o.narrative); }
      }
    }
  }

  function fmtNarr(t){
    let s = esc(t);
    s = s.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
    s = s.replace(/〔d100=(\d+)〕/g, '<span class="dice">〔d100=$1〕</span>');
    s = s.replace(/={3,}/g, '<span class="sep">━━━━━━━━━━</span>');
    return s;
  }
  function esc(t){ return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  function clamp(v){ return Math.max(0, Math.min(100, v)); }

  function renderState(){
    if(!state){ statEl.innerHTML = '<div class="stat-row"><span class="k">尚未开始</span></div>'; return; }
    const a = state.attributes || {};
    const pct = (v,m)=> m>0 ? clamp(Math.round(v/m*100)) : 0;
    const se = Array.isArray(state.state_effects) ? state.state_effects : [];
    const effects = se.length ? "｜"+se.join("、") : "";
    statEl.innerHTML = `
      <div class="sec">
        <div class="sec-title">身份</div>
        <div class="stat-row"><span class="k">姓名</span><span class="v">${esc(state.name||'—')}</span></div>
        <div class="stat-row"><span class="k">境界</span><span class="v">${esc(state.realm||'—')}(${state.progress||0}%)</span></div>
        <div class="stat-row"><span class="k">Lv</span><span class="v">${state.lv||0}</span></div>
        <div class="stat-row"><span class="k">基因锁</span><span class="v">${esc(state.genelock||'无')} ${state.genecount||''}</span></div>
      </div>
      <div class="sec">
        <div class="sec-title">属性</div>
        <div class="stat-row"><span class="k">智力</span><span class="v">${a.智力??100}</span></div>
        <div class="stat-row"><span class="k">精神力</span><span class="v">${a.精神力??100}</span></div>
        <div class="stat-row"><span class="k">细胞活力</span><span class="v">${a.细胞活力??100}</span></div>
        <div class="stat-row"><span class="k">神经反应</span><span class="v">${a.神经反应??100}</span></div>
        <div class="stat-row"><span class="k">肌肉组织</span><span class="v">${a.肌肉组织??100}</span></div>
        <div class="stat-row"><span class="k">免疫力</span><span class="v">${a.免疫力??100}</span></div>
      </div>
      <div class="sec">
        <div class="sec-title">状态${effects}</div>
        <div class="stat-row"><span class="k">气血</span><span class="v">${state.hp}/${state.hp_max}</span></div>
        <div class="bar green"><div style="width:${pct(state.hp,state.hp_max)}%"></div></div>
        <div class="stat-row"><span class="k">灵力</span><span class="v">${state.mp}/${state.mp_max}</span></div>
        <div class="bar"><div style="width:${pct(state.mp,state.mp_max)}%"></div></div>
        <div class="stat-row"><span class="k">复活</span><span class="v">${state.revive}/${state.revive_max}</span></div>
        <div class="stat-row"><span class="k">变质</span><span class="v">${state.corruption}/100（下限${state.corruption_min||0}）</span></div>
        <div class="bar corruption"><div style="width:${clamp(state.corruption||0)}%"></div></div>
      </div>
      <div class="sec">
        <div class="sec-title">资源</div>
        <div class="stat-row"><span class="k">奖励点</span><span class="v">${state.reward_points||0}</span></div>
        <div class="stat-row"><span class="k">灵石</span><span class="v">${state.spirit_stone||0}</span></div>
        <div class="stat-row"><span class="k">可能性</span><span class="v">★ ${state.possibility||0}</span></div>
        <div class="stat-row"><span class="k">签到</span><span class="v">第 ${state.signin_day||0} 天</span></div>
      </div>
      <div class="sec">
        <div class="sec-title">时间</div>
        <div class="stat-row"><span class="k">天数</span><span class="v">第 ${state.day||1} 天</span></div>
        <div class="stat-row"><span class="k">世界时钟</span><span class="v">下次推进 第 ${state.worldclock_day||0} 天</span></div>
        ${state.heartdemon_left!=null && state.heartdemon_left!==undefined ? `<div class="stat-row"><span class="k">心魔保底</span><span class="v">剩余 ${state.heartdemon_left} 天</span></div>` : ''}
      </div>
      <div class="sec">
        <div class="sec-title">其他</div>
        <div class="stat-row"><span class="k">主线</span><span class="v">${esc(state.main_story||'—')}</span></div>
        <div class="stat-row"><span class="k">阵营</span><span class="v">${esc(state.camp||'—')}·${esc(state.reputation||'—')}</span></div>
        <div class="stat-row"><span class="k">执念</span><span class="v">${esc(state.obsession||'无')}</span></div>
      </div>
    `;
  }

  function renderOptions(opts){
    optsEl.innerHTML = "";
    if(!opts || !opts.length) return;
    opts.forEach((o,i)=>{
      const b = document.createElement("button");
      b.className = "opt";
      b.dataset.text = o;
      b.innerHTML = '<b>'+(i+1)+'</b>　'+esc(o);
      optsEl.appendChild(b);
    });
    if(busy) document.querySelectorAll("#options .opt").forEach(o=>o.disabled = true);
  }

  function renderGameover(){
    if(state && state.game_over){
      gameoverEl.style.display = "block";
      const ending = state.ending || (state.corruption>=100 ? "变质满值，人格崩坏（偏转态）" : "复活归零，真死");
      gameoverEl.textContent = "⚑ 游戏结束 —— " + ending + "。 可点「重新开始」开新周目，或「导出存档」留存。";
      inputEl.disabled = true; sendEl.disabled = true;
      optsEl.innerHTML = "";
    } else {
      gameoverEl.style.display = "none";
      if(!busy){ inputEl.disabled = false; sendEl.disabled = false; }
    }
  }

  // 入口：无 key 时停在设置页；有 key 进入游戏
  if(!apiKey){ setupEl.style.display = "flex"; gameEl.style.display = "none"; }
})();
</script>
</body>
</html>
